<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cobaya Clicker</title>
<style>
  body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:#3b2a1a;background:#fdf1dc}
  #paisaje{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
  .esc{opacity:0;transition:opacity 1.2s}
  main{display:grid;grid-template-columns:minmax(220px,280px) 1fr minmax(220px,280px);gap:20px;padding:16px;max-width:1600px;margin:auto}
  .lado{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;font-size:14px;opacity:.92}
  .lado .item{padding:7px 9px;margin:4px 0}
  .lado .item .em{font-size:20px}
  .lado .item .n{font-size:16px}
  .lado h2{font-size:15px}
  @media (max-width:800px){main{grid-template-columns:1fr}.centro{order:-1}.lado{position:static;max-height:none}}
  .panel{background:#fffaf2c7;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:18px;padding:14px;box-shadow:0 4px 18px #0001}
  h2{margin:4px 0 8px;font-size:18px}
  .centro{text-align:center;position:relative}
  .z{font-size:40px;font-weight:800;margin:0}
  .sub{margin:2px 0;opacity:.75}
  .barra{height:12px;background:#0001;border-radius:8px;overflow:hidden;margin:6px 0 2px}
  .barra div{height:100%;width:0;background:#ff6fa5;transition:width .2s}
  .stats{display:inline-block;padding:10px 22px;min-width:min(420px,100%);box-sizing:border-box}
  #cobaya{background:none;border:0;padding:0;cursor:pointer;width:100%;max-width:min(620px,68vh);margin-top:8px;filter:drop-shadow(0 18px 14px #0003);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #cobaya svg{width:100%;transition:transform .08s}
  #cobaya:active svg{transform:scale(.92)}
  .item{display:flex;box-sizing:border-box;width:100%;align-items:center;gap:10px;text-align:left;border:0;border-radius:12px;padding:10px;margin:6px 0;background:#fff;cursor:pointer;font:inherit;color:inherit;touch-action:manipulation}
  .item:hover:not(:disabled){background:#fff0e0}
  .item:disabled{opacity:.45;cursor:not-allowed}
  .item.puesto{outline:3px solid #ff6fa5}
  .item .em{font-size:26px}
  .item b{display:block}
  .item small{opacity:.75}
  .item .n{margin-left:auto;font-size:20px;font-weight:800}
  .flota{position:absolute;pointer-events:none;font-weight:800;font-size:28px;color:#e2711d;text-shadow:0 2px 0 #fff;animation:sube .8s ease-out forwards}
  .flotar{animation:flotar 4s ease-in-out infinite alternate}
  @keyframes flotar{to{transform:translateY(-16px)}}
  .saltito{animation:saltito 1.6s ease-in-out infinite}
  @keyframes saltito{50%{transform:translateY(-10px)}}
  .humo{animation:humo 2.5s linear infinite}
  @keyframes humo{from{transform:translateY(0);opacity:.9}to{transform:translateY(-50px);opacity:0}}
  .nube{animation:nube 30s ease-in-out infinite alternate}
  @keyframes nube{to{transform:translateX(120px)}}
  .brilla{animation:brilla 2s ease-in-out infinite alternate}
  @keyframes brilla{to{opacity:.15}}
  .mano{animation:toca .6s ease-in-out infinite}
  @keyframes toca{50%{transform:translateX(-8px)}}
  @media (prefers-reduced-motion:reduce){.flotar,.saltito,.humo,.nube,.brilla,.mano{animation:none}}
  @keyframes sube{to{transform:translateY(-70px);opacity:0}}
  #toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-120px);background:#3b2a1a;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;transition:transform .3s;z-index:9}
  #toast.on{transform:translate(-50%,0)}
  .borrar{margin-top:4px;background:none;border:0;color:inherit;opacity:.8;cursor:pointer;font:inherit;text-decoration:underline}
</style>
</head>

  {nivel: 3, nombre: 'Salón',    id: 'salon'},
  {nivel: 5, nombre: 'Jardín',   id: 'jardin'},
  {nivel: 7, nombre: 'Castillo', id: 'castillo'},
  {nivel: 9, nombre: 'Espacio',  id: 'espacio'},
];

const $ = id => document.getElementById(id);
const coste = (base, n) => Math.ceil(base * 1.15 ** n);
const costeDientes = n => 40 * 3 ** n;
const umbral = l => l <= 1 ? 0 : 50 * 4 ** (l - 2); // zanahorias totales para llegar al nivel l
function nivelPara(total) { let l = 1; while (total >= umbral(l + 1)) l++; return l; }
function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n) + '';
  const u = ['K', 'M', 'B', 'T']; let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : 1).replace(/\.?0+$/, '') + u[i];
}
console.assert(nivelPara(0) === 1 && nivelPara(50) === 2 && nivelPara(199) === 2 && nivelPara(200) === 3, 'niveles');
console.assert(fmt(1500) === '1.5K' && fmt(0.5) === '0.5' && fmt(999.9) === '999', 'fmt');

// Partida guardada
const GUARDADO = 'cobaya-clicker';
let S = {z: 0, total: 0, prod: {}, dientes: 0, atuendos: [], puesto: {}, nivel: 1, clics: 0, autoclic: 0, hitos: 0,
  personajes: ['canela'], personaje: 'canela', sonido: true};
try { Object.assign(S, JSON.parse(localStorage.getItem(GUARDADO)) || {}); } catch (e) {}
const guardar = () => localStorage.setItem(GUARDADO, JSON.stringify(S));

const tiene = id => S.personajes.includes(id);
const mult = () => (1 + 0.1 * (S.nivel - 1)) * (1 + 0.05 * S.atuendos.length) * (tiene('dorada') ? 2 : 1);
const multProd = () => mult() * (tiene('oreo') ? 1.5 : 1);
const cps = () => PRODUCTORES.reduce((s, p) => s + p.cps * (S.prod[p.id] || 0), 0) * multProd();
const porClick = () => (1 + S.dientes) * mult() * (1 + 0.25 * S.hitos) * (tiene('nube') ? 1.5 : 1);
const autoPorSeg = () => S.autoclic * (tiene('rizos') ? 2 : 1);

// Recompensas por clics (los autoclics también cuentan)
const HITOS = [
  {clics: 100,   em: '🥉', nombre: 'Bronce'},
  {clics: 1e3,   em: '🥈', nombre: 'Plata'},
  {clics: 1e4,   em: '🥇', nombre: 'Oro'},
  {clics: 1e5,   em: '🏆', nombre: 'Trofeo'},
  {clics: 1e6,   em: '💎', nombre: 'Diamante'},
  {clics: 1e7,   em: '🌟', nombre: 'Leyenda'},
];
const costeAuto = n => Math.ceil(100 * 1.4 ** n);
function sumarClics(n) {
  S.clics += n;
  ganar(n * porClick());
  while (S.hitos < HITOS.length && S.clics >= HITOS[S.hitos].clics) {
    const h = HITOS[S.hitos++];
    ganar(h.clics * mult()); // premio: tantas zanahorias como clics del hito
    toast(`${h.em} ¡Medalla ${h.nombre}! ${fmt(h.clics)} clics · +${fmt(h.clics * mult())} 🥕 y +25% por click`);
  }
}

function toast(t) {
  $('toast').textContent = t; $('toast').classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('on'), 2500);
}

function ganar(n) {
  S.z += n; S.total += n;
  const l = nivelPara(S.total);
  if (l > S.nivel) {
    S.nivel = l;
    const nuevos = ATUENDOS.filter(a => a.nivel === l).map(a => a.em + ' ' + a.nombre);
    const esc = ESCENAS.find(e => e.nivel === l);
    toast(`¡Nivel ${l}!` + (esc ? ` Nuevo escenario: ${esc.nombre}` : '') + (nuevos.length ? ` · Desbloqueado: ${nuevos.join(', ')}` : ''));
    pintarEscena();
  }
}

function pintarEscena() {
  const esc = ESCENAS.filter(e => S.nivel >= e.nivel).pop();
  $('escena').textContent = esc.nombre;
  for (const e of ESCENAS) $('p-' + e.id).style.opacity = e === esc ? 1 : 0;
}

function pintarPersonaje() {
  const p = PERSONAJES.find(p => p.id === S.personaje) || PERSONAJES[0];
  ['cuerpo', 'mancha', 'panza', 'oreja'].forEach((parte, i) =>
    document.querySelectorAll('.c-' + parte).forEach(el => el.setAttribute('fill', p.colores[i])));
  $('cobaya').setAttribute('aria-label', `Acariciar a ${p.nombre}`);
}

// Chillido "uic" sintetizado: no hace falta ningún archivo de audio
let audio;
function uic() {
  if (!S.sonido) return;
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state !== 'running') audio.resume();
  const t = audio.currentTime + 0.01, o = audio.createOscillator(), g = audio.createGain();
  const f = 900 + Math.random() * 400;
  o.type = 'triangle';
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 1.8, t + 0.08);
  o.frequency.exponentialRampToValueAtTime(f * 1.2, t + 0.16);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + 0.2);
}

// Las mejoras compradas aparecen en el paisaje y crecen con cada compra
const cuerpoCobaya = ([c, m, p, o]) => `<ellipse cx="65" cy="62" rx="20" ry="14" fill="${o}"/><ellipse cx="175" cy="62" rx="20" ry="14" fill="${o}"/><ellipse cx="85" cy="185" rx="15" ry="9" fill="#f2c1a0"/><ellipse cx="155" cy="185" rx="15" ry="9" fill="#f2c1a0"/><ellipse cx="120" cy="120" rx="95" ry="65" fill="${c}"/><ellipse cx="72" cy="100" rx="38" ry="32" fill="${m}"/><ellipse cx="120" cy="145" rx="55" ry="38" fill="${p}"/><circle cx="90" cy="100" r="10" fill="#222"/><circle cx="150" cy="100" r="10" fill="#222"/><ellipse cx="120" cy="120" rx="8" ry="6" fill="#f29bb0"/>`;
const PLANETA_COLORES = ['#9b7cf2', '#ffb36b', '#5fd3c4', '#ff7aa8'];
function pintarMejoras() {
  const n = id => S.prod[id] || 0;
  // Dientes: crecen un poquito con cada compra
  $('dientes').style.display = S.dientes ? '' : 'none';
  for (const d of ['d1', 'd2']) $(d).setAttribute('height', 5 + Math.min(S.dientes, 40) * 0.4);
  // Autoclic: manitas que tocan a la cobaya
  [...$('manos').children].forEach((m, i) => m.style.display = i < S.autoclic ? '' : 'none');

  // Huerto: dos parcelas que se van llenando; las plantas crecen y salen zanahorias
  const hu = n('huerto'), tam = 0.6 + Math.min(hu, 40) * 0.02, sitios = [];
  for (const y of [852, 888]) for (let x = 360; x <= 1240; x += 55) sitios.push([x + (y > 870 ? 27 : 0), y]);
  sitios.sort((a, b) => Math.abs(b[0] - 800) - Math.abs(a[0] - 800)); // empieza por los lados de la cobaya
  $('m-huerto').innerHTML = sitios.slice(0, hu).map(([x, y]) => `<g transform="translate(${x} ${y}) scale(${tam})"><ellipse rx="30" ry="9" fill="#6b4423"/><path d="M0 0 C-14 -20 -18 -40 -10 -52 C-4 -38 0 -24 0 0 C2 -26 8 -44 16 -54 C20 -36 12 -18 0 0" fill="#3f9b3a"/>${hu >= 4 ? '<path d="M-12 0 a12 9 0 0 1 24 0z" fill="#ff8a2a"/>' : ''}</g>`).join('');

  // Pajar: balas de heno apiladas en pirámide
  const balas = [[1180, 640], [1285, 640], [1390, 640], [1495, 640], [1232, 580], [1337, 580], [1442, 580], [1285, 520], [1390, 520], [1337, 460]];
  $('m-heno').innerHTML = balas.slice(0, n('heno')).map(([x, y]) => `<g transform="translate(${x - 50} ${y})"><rect width="100" height="60" rx="12" fill="#e9c55c" stroke="#c49a2e" stroke-width="4"/><path d="M10 20 h80 M10 40 h80" stroke="#c49a2e" stroke-width="3"/><rect x="28" width="8" height="60" fill="#b07b2a"/><rect x="64" width="8" height="60" fill="#b07b2a"/></g>`).join('');

  // Fábricas en el horizonte, más grandes cuantas más tengas
  const ef = 0.7 + Math.min(n('fabrica'), 20) * 0.025;
  $('m-fabricas').innerHTML = [470, 1130, 300, 1300].slice(0, n('fabrica')).map(x => `<g transform="translate(${x} 605) scale(${ef})"><rect x="-80" y="-90" width="160" height="90" fill="#9b8f86"/><path d="M-80 -90 l40 -30 v30 l40 -30 v30 l40 -30 v30 l40 -30 v30z" fill="#7d726a"/><rect x="40" y="-170" width="24" height="80" fill="#6c625b"/><rect x="-60" y="-55" width="30" height="25" fill="#ffd27a"/><rect x="-15" y="-55" width="30" height="25" fill="#ffd27a"/><path d="M25 -40 l22 -8 v16z" fill="#ff8a2a"/><g class="humo"><circle cx="52" cy="-185" r="14" fill="#eee"/><circle cx="62" cy="-210" r="18" fill="#eee" opacity=".7"/></g></g>`).join('');

  // Planetas en el cielo
  const rp = 26 + Math.min(n('planeta'), 30);
  $('m-planetas').innerHTML = [[180, 330], [1460, 430], [640, 110], [1000, 330]].slice(0, n('planeta')).map(([x, y], i) => `<g transform="translate(${x} ${y})"><g class="flotar" style="animation-delay:-${i * 1.3}s"><circle r="${rp}" fill="${PLANETA_COLORES[i]}"/><ellipse rx="${rp * 1.8}" ry="${rp * 0.4}" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5" transform="rotate(-20)"/></g></g>`).join('');

  // Cobayas amigas paseando por el suelo
  const sitiosAmigas = [[690, 800], [930, 820], [560, 880], [1060, 880], [420, 720], [1180, 730], [800, 880], [300, 860]];
  $('m-amigas').innerHTML = sitiosAmigas.slice(0, n('amiga')).map(([x, y], i) => `<g transform="translate(${x - 50} ${y - 80}) scale(.42)"><g class="saltito" style="animation-delay:-${i * 0.4}s">${cuerpoCobaya(PERSONAJES[i % PERSONAJES.length].colores)}</g></g>`).join('');
}

function pintarAtuendos() {
  for (const a of ATUENDOS) $('o-' + a.id).style.display = S.puesto[a.slot] === a.id ? '' : 'none';
}

// Botones de la tienda: se crean una vez y luego solo se actualizan
function crearBoton(padre, alClicar) {
  const b = document.createElement('button');
  b.className = 'item';
  b.innerHTML = '<span class="em"></span><span><b></b><small></small></span><span class="n"></span>';
  b.onclick = alClicar;
  padre.appendChild(b);
  return b;
}
function rellenar(b, em, titulo, detalle, n) {
  b.children[0].textContent = em;
  b.children[1].children[0].textContent = titulo;
  b.children[1].children[1].textContent = detalle;
  b.children[2].textContent = n;
}

const botonDientes = crearBoton($('mejoras'), () => {
  const c = costeDientes(S.dientes);
  if (S.z >= c) { S.z -= c; S.dientes++; pintarMejoras(); }
});
const botonAuto = crearBoton($('mejoras'), () => {
  const c = costeAuto(S.autoclic);
  if (S.z >= c) { S.z -= c; S.autoclic++; pintarMejoras(); }
});
const filasHitos = HITOS.map(() => $('hitos').appendChild(Object.assign(document.createElement('div'), {className: 'item'})));
const botonesProd = PRODUCTORES.map(p => crearBoton($('mejoras'), () => {
  const c = coste(p.base, S.prod[p.id] || 0);
  if (S.z >= c) { S.z -= c; S.prod[p.id] = (S.prod[p.id] || 0) + 1; pintarMejoras(); }
}));
const botonesPersonaje = PERSONAJES.map(p => crearBoton($('personajes'), () => {
  if (!tiene(p.id)) {
    if (S.nivel < p.nivel || S.z < p.coste) return;
    S.z -= p.coste; S.personajes.push(p.id);
    toast(`🐹 ¡${p.nombre} se une a la familia! ${p.mejora}`);
  }
  S.personaje = p.id;
  pintarPersonaje();
}));
const botonesAtuendo = ATUENDOS.map(a => crearBoton($('atuendos'), () => {
  if (!S.atuendos.includes(a.id)) {
    if (S.nivel < a.nivel || S.z < a.coste) return;
    S.z -= a.coste; S.atuendos.push(a.id);
    toast(`${a.em} ¡${a.nombre} conseguido! (+5% a todo)`);
  }
  S.puesto[a.slot] = S.puesto[a.slot] === a.id ? null : a.id;
  pintarAtuendos();
}));

function actualizar() {
  $('z').textContent = fmt(Math.floor(S.z));
  $('cps').textContent = fmt(cps());
  $('pc').textContent = fmt(porClick());
  $('nivel').textContent = S.nivel;
  const ini = umbral(S.nivel), fin = umbral(S.nivel + 1);
  $('barra').style.width = Math.min(100, (S.total - ini) / (fin - ini) * 100) + '%';
  $('falta').textContent = `Faltan ${fmt(Math.ceil(fin - S.total))} 🥕 para el nivel ${S.nivel + 1}`;

  const cd = costeDientes(S.dientes);
  rellenar(botonDientes, '🦷', 'Dientes afilados', `+1 por click · 🥕 ${fmt(cd)}`, S.dientes);
  botonDientes.disabled = S.z < cd;
  const ca = costeAuto(S.autoclic);
  rellenar(botonAuto, '🤖', 'Autoclic', `+1 clic por segundo · 🥕 ${fmt(ca)}`, S.autoclic);
  botonAuto.disabled = S.z < ca;
  $('clics').textContent = fmt(Math.floor(S.clics));
  $('auto').textContent = autoPorSeg();
  HITOS.forEach((h, i) => {
    const hecho = i < S.hitos;
    filasHitos[i].textContent = `${hecho ? h.em : '⬜'} ${h.nombre}: ${fmt(h.clics)} clics — ` +
      (hecho ? '✅ conseguida' : `${fmt(Math.floor(Math.min(S.clics, h.clics)))} / ${fmt(h.clics)}`);
    filasHitos[i].style.opacity = hecho || i === S.hitos ? 1 : 0.7;
  });
  PRODUCTORES.forEach((p, i) => {
    const n = S.prod[p.id] || 0, c = coste(p.base, n);
    rellenar(botonesProd[i], p.em, p.nombre, `+${fmt(p.cps * multProd())}/s · 🥕 ${fmt(c)}`, n);
    botonesProd[i].disabled = S.z < c;
  });
  $('sonido').textContent = S.sonido ? '🔊 Sonido: sí' : '🔇 Sonido: no';
  PERSONAJES.forEach((p, i) => {
    const b = botonesPersonaje[i], mio = tiene(p.id), elegida = S.personaje === p.id;
    if (mio) rellenar(b, '⬤', p.nombre, `${p.mejora} · ${elegida ? 'en pantalla' : 'toca para elegir'}`, '');
    else if (S.nivel < p.nivel) rellenar(b, '🔒', p.nombre, `${p.mejora} · nivel ${p.nivel}`, '');
    else rellenar(b, '⬤', p.nombre, `${p.mejora} · 🥕 ${fmt(p.coste)}`, '');
    b.children[0].style.color = mio || S.nivel >= p.nivel ? p.colores[0] : '';
    b.children[0].style.webkitTextStroke = '1px #0003';
    b.disabled = !mio && (S.nivel < p.nivel || S.z < p.coste);
    b.classList.toggle('puesto', elegida);
  });
  ATUENDOS.forEach((a, i) => {
    const b = botonesAtuendo[i], tengo = S.atuendos.includes(a.id), puesto = S.puesto[a.slot] === a.id;
    if (tengo) rellenar(b, a.em, a.nombre, puesto ? 'Puesto · toca para quitar' : 'Toca para ponértelo', '');
    else if (S.nivel < a.nivel) rellenar(b, '🔒', a.nombre, `Se desbloquea en el nivel ${a.nivel}`, '');
    else rellenar(b, a.em, a.nombre, `🥕 ${fmt(a.coste)}`, '');
    b.disabled = !tengo && (S.nivel < a.nivel || S.z < a.coste);
    b.classList.toggle('puesto', puesto);
  });
}

$('cobaya').addEventListener('click', e => {
  const n = porClick();
  uic(); sumarClics(1);
  const r = $('centro').getBoundingClientRect(), f = document.createElement('span');
  f.className = 'flota'; f.textContent = '+' + fmt(n);
  // Con teclado no hay coordenadas: sale en el centro de la cobaya
  const bx = e.clientX || $('cobaya').getBoundingClientRect().x + $('cobaya').offsetWidth / 2, by = e.clientY || $('cobaya').getBoundingClientRect().y + $('cobaya').offsetHeight / 2;
  f.style.left = (bx - r.left - 15) + 'px'; f.style.top = (by - r.top - 20) + 'px';
  $('centro').appendChild(f); setTimeout(() => f.remove(), 800);
  actualizar();
});

$('sonido').onclick = () => { S.sonido = !S.sonido; actualizar(); };
$('borrar').onclick = () => {
  if (!confirm('¿Seguro que quieres borrar toda la partida?')) return;
  borrando = true; localStorage.removeItem(GUARDADO); location.reload();
};
let borrando = false;
addEventListener('beforeunload', () => { if (!borrando) guardar(); });
setInterval(guardar, 5000);

let ultimo = performance.now();
setInterval(() => {
  const ahora = performance.now();
  const dt = (ahora - ultimo) / 1000; ultimo = ahora;
  ganar(cps() * dt);
  if (S.autoclic) sumarClics(autoPorSeg() * dt);
  actualizar();
}, 100);

const azar = (a, b) => a + Math.random() * (b - a);
$('flores').innerHTML = Array.from({length: 45}, () => {
  const x = azar(0, 1600), y = azar(630, 890), c = ['#ff7aa8', '#ffd54a', '#fff', '#c58bff'][Math.floor(azar(0, 4))];
  return `<circle cx="${x}" cy="${y}" r="${azar(4, 8)}" fill="${c}"/><circle cx="${x}" cy="${y}" r="2.5" fill="#f5a623"/>`;
}).join('');
$('estrellas').innerHTML = Array.from({length: 150}, (_, i) =>
  `<circle cx="${azar(0, 1600)}" cy="${azar(0, 640)}" r="${azar(0.8, 2.6)}" fill="#fff" opacity="${azar(0.4, 1)}"${i % 5 ? '' : ' class="brilla"'}/>`).join('');

pintarEscena(); pintarAtuendos(); pintarPersonaje(); pintarMejoras(); actualizar();
</script>
</body>
</html>
